# Render Blueprint for Beacon: FastAPI backend (with persistent disk for
# SQLite + ChromaDB + uploaded files) and the Next.js frontend.
#
# The two secrets (sync: false) are entered once in the Render dashboard:
#   BEACON_OPENAI_API_KEY - the OpenAI key (same value as backend/.env locally)
#   BEACON_ACCESS_KEY     - any long random string; the app asks for it on
#                           first visit and the API rejects requests without it
#
# The service names below determine the URLs. If Render reports a name is
# taken, change BOTH the name and the matching URL env vars.

services:
  - type: web
    name: beacon-backend
    runtime: python
    rootDir: backend
    plan: starter # disks require a paid instance; this is where the data lives
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: beacon-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BEACON_DATABASE_URL
        value: sqlite:////var/data/beacon.db
      - key: BEACON_CHROMA_DIR
        value: /var/data/chroma
      - key: BEACON_DATA_DIR
        value: /var/data/uploads
      - key: BEACON_RAG_AUTOSYNC
        value: "1"
      - key: BEACON_CORS_ORIGINS
        value: https://beacon-frontend-app.onrender.com
      - key: BEACON_OPENAI_API_KEY
        sync: false
      - key: BEACON_ACCESS_KEY
        sync: false
      # Google auto-sync (GA4 Data API + Search Console). Client id/secret come
      # from the Google Cloud OAuth client; leave blank to keep it disabled.
      - key: BEACON_GOOGLE_CLIENT_ID
        sync: false
      - key: BEACON_GOOGLE_CLIENT_SECRET
        sync: false
      - key: BEACON_GOOGLE_REDIRECT_URI
        value: https://beacon-backend-s6yd.onrender.com/api/google/callback
      - key: BEACON_FRONTEND_URL
        value: https://beacon-frontend-app.onrender.com
      - key: BEACON_GOOGLE_AUTOSYNC
        value: "1"
      # Weekly AI Visibility standing-prompt runs (spends OpenAI budget, capped
      # by the per-property daily limit). Off by default; set to "1" to enable.
      - key: BEACON_AI_VISIBILITY_AUTORUN
        value: "0"
      # Login. The founder's account is created once at startup from these two
      # values (platform admin, owner of the default organization); afterwards
      # they can stay set or be removed. BEACON_ACCESS_KEY above stays valid as
      # a break-glass credential for scripts.
      - key: BEACON_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BEACON_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Stripe billing (Checkout + Customer Portal). Leave blank to keep online
      # billing off; the app then says invoices are handled by hand. The price
      # ids come from the Stripe dashboard (two recurring per-community prices,
      # one one-time audit price); the webhook secret from the endpoint
      # https://beacon-backend-s6yd.onrender.com/api/billing/webhook.
      - key: BEACON_STRIPE_SECRET_KEY
        sync: false
      - key: BEACON_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BEACON_STRIPE_PRICE_STANDARD
        sync: false
      - key: BEACON_STRIPE_PRICE_ADVANCED
        sync: false
      - key: BEACON_STRIPE_PRICE_AUDIT
        sync: false
      # Optional outbound email for invites and resets ("resend" + API key +
      # from address). Blank = links are shown to the admin to pass on.
      - key: BEACON_EMAIL_PROVIDER
        value: ""
      - key: BEACON_EMAIL_API_KEY
        sync: false
      - key: BEACON_EMAIL_FROM
        value: ""

  - type: web
    name: beacon-frontend-app
    runtime: node
    rootDir: frontend
    plan: free # no disk needed; upgrade to starter if cold starts annoy you
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_BASE
        value: https://beacon-backend-s6yd.onrender.com/api
